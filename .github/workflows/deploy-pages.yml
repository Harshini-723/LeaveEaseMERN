

name: Deploy LeaveEase to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend API URL
        run: grep -n "const API" src/App.jsx
        working-directory: ./client

      - name: Install dependencies
        run: npm ci
        working-directory: ./client

      - name: Build React app
        run: npm run build
        working-directory: ./client
        env:
          VITE_API_URL: https://leaveeasemern.onrender.com

      - name: Check built API URL
        run: |
          if grep -R "localhost:5000" dist; then
            echo "ERROR: Old localhost URL found in build"
            exit 1
          fi
          echo "Frontend API URL check passed"
        working-directory: ./client

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
